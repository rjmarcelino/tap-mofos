<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link-in-bio builder</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:520px;margin:24px auto;padding:0 16px 60px}
input,textarea,select,button{width:100%;padding:10px;margin:6px 0;font:inherit;font-size:16px}
button{cursor:pointer}
label{display:block;margin-top:16px;font-weight:600}
.row{border:1px solid #bbb;border-radius:8px;padding:6px 10px 10px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{width:auto;margin:0;padding:4px 12px;font-size:14px}
#prev{display:none;width:60%;max-width:260px;aspect-ratio:5/6;margin:8px 0;background:center/cover #ccc;
  -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
.lh{display:flex;align-items:center;gap:8px}
.ico{display:flex}
.ico svg{width:22px;height:22px;display:block}
small{color:#666}
</style></head>
<body>
<h2>Link-in-bio builder</h2>
<input id="owner" placeholder="GitHub username">
<input id="repo" placeholder="Repo name">
<input id="token" type="password" placeholder="Fine-grained token">
<hr>

<input id="slug" placeholder="Slug (e.g. jane) - becomes the link">
<input id="name" placeholder="Display name">
<input id="bio" placeholder="Bio">
<select id="theme"><option>dark</option><option>light</option><option>ocean</option></select>

<label for="photo">Profile photo</label>
<input id="photo" type="file" accept="image/*">
<div id="prev"></div>
<small>Shown at the top of your page and fades out before the first button. Leave empty to keep the current photo.</small>

<label>Links</label>
<div id="links"></div>
<button id="add" type="button">+ Add link</button>
<button id="addphone" type="button">+ Add phone number</button>

<button id="save" type="button">Save page</button>
<p id="msg"></p>

<script>
const $ = id => document.getElementById(id);
['owner','repo','token'].forEach(k => {
  $(k).value = localStorage.getItem('lib_' + k) || '';
  $(k).addEventListener('change', () => localStorage.setItem('lib_' + k, $(k).value.trim()));
});

const ICONS = {
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/>',
  facebook: '<path fill="currentColor" d="M13.5 21v-7.5h2.6l.4-3h-3V8.7c0-.9.3-1.5 1.5-1.5h1.6V4.5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.2H8v3h2.5V21z"/>',
  tiktok: '<path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.3 2.6 2 4.4 5 4.6"/>',
  youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M10 9.2v5.6l5-2.8z"/>',
  x: '<path d="M4 4l16 16M20 4L4 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  linkedin: '<rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10.5V16M8 7.8v.1M12 16v-5.5M12 13c0-1.6 1-2.5 2.2-2.5S16 11.4 16 13v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  spotify: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 9.5c3-1 6.5-.7 9 .8M8 12.6c2.5-.7 5-.5 7.4.8M8.6 15.5c2-.5 4-.3 5.8.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  telegram: '<path d="M21 4 3 11l6 2.2L11 20l3-4.5 5 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  email: '<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const HOSTS = [
  [/(^|\.)instagram\.com$/, 'instagram'],
  [/(^|\.)(facebook|fb)\.com$|^fb\.me$/, 'facebook'],
  [/(^|\.)tiktok\.com$/, 'tiktok'],
  [/(^|\.)youtube\.com$|^youtu\.be$/, 'youtube'],
  [/(^|\.)(x|twitter)\.com$/, 'x'],
  [/(^|\.)linkedin\.com$/, 'linkedin'],
  [/(^|\.)spotify\.com$/, 'spotify'],
  [/^t\.me$|(^|\.)telegram\.org$/, 'telegram']
];
function iconFor(url) {
  const u = String(url || '').trim();
  if (/^mailto:/i.test(u)) return 'email';
  if (/^tel:/i.test(u)) return 'phone';
  try {
    const h = new URL(/^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u).hostname.toLowerCase();
    const m = HOSTS.find(([re]) => re.test(h));
    return m ? m[1] : '';
  } catch (e) { return ''; }
}
const svg = name => ICONS[name] ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>` : '';

// ---- link rows ----
const list = $('links');
function renumber() {
  [...list.children].forEach((r, i) => r.querySelector('.n').textContent = (r.dataset.type === 'phone' ? 'Phone ' : 'Link ') + (i + 1));
}
function addRow(type) {
  const d = document.createElement('div');
  d.className = 'row';
  d.dataset.type = type === 'phone' ? 'phone' : 'link';
  d.innerHTML = `<div class="top"><span class="lh"><i class="ico"></i><b class="n"></b></span><button type="button" class="rm">Remove</button></div>
    <input class="lbl" placeholder="Button text (e.g. Instagram)">
    ${type === 'phone'
      ? '<input class="url" type="tel" inputmode="tel" placeholder="Phone number (e.g. +63 912 345 6789)">'
      : '<input class="url" type="url" inputmode="url" placeholder="URL (e.g. https://instagram.com/yourname)">'}`;
  const ico = d.querySelector('.ico'), urlBox = d.querySelector('.url');
  urlBox.oninput = () => { ico.innerHTML = d.dataset.type === 'phone' ? svg('phone') : svg(iconFor(urlBox.value)); };
  urlBox.oninput();
  d.querySelector('.rm').onclick = () => { d.remove(); renumber(); };
  list.appendChild(d);
  renumber();
}
$('add').onclick = () => addRow();
$('addphone').onclick = () => addRow('phone');
addRow();

const telUrl = v => { const n = v.replace(/[^\d+]/g, '').replace(/(?!^)\+/g, ''); return n.replace(/\D/g, '').length >= 5 ? 'tel:' + n : ''; };
const fixUrl = u => !u ? '' : /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u;

// ---- photo ----
let photo = null;
$('photo').onchange = e => {
  photo = e.target.files[0] || null;
  $('prev').style.display = photo ? 'block' : 'none';
  if (photo) $('prev').style.backgroundImage = `url(${URL.createObjectURL(photo)})`;
};

function resize(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => bad(new Error('Could not read that image.'));
    img.src = URL.createObjectURL(file);
  });
}

// ---- save ----
$('save').onclick = async () => {
  const owner = $('owner').value.trim(), repo = $('repo').value.trim(), token = $('token').value.trim();
  const slug = $('slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
  const msg = $('msg'), btn = $('save');
  if (!owner || !repo || !token || !slug) { msg.textContent = 'Fill owner, repo, token and slug.'; return; }

  const links = [...list.children].map(r => ({
    label: r.querySelector('.lbl').value.trim(),
    url: r.dataset.type === 'phone' ? telUrl(r.querySelector('.url').value) : fixUrl(r.querySelector('.url').value.trim())
  })).filter(l => l.label && l.url);

  const api = p => `https://api.github.com/repos/${owner}/${repo}/contents/${p}`;
  const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };

  btn.disabled = true;
  msg.textContent = 'Saving...';
  try {
    let sha, avatar = '';
    const ex = await fetch(api(`pages/${slug}.json`), { headers, cache: 'no-store' });
    if (ex.ok) {
      const j = await ex.json();
      sha = j.sha;
      try { avatar = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))))).avatar || ''; } catch (e) {}
    }

    if (photo) {
      const p = `images/${slug}-${Date.now().toString(36)}.jpg`;
      const r = await fetch(api(p), { method: 'PUT', headers,
        body: JSON.stringify({ message: 'Add photo for ' + slug, content: await resize(photo) }) });
      if (!r.ok) throw new Error('Photo upload failed (' + r.status + '): ' + await r.text());
      avatar = p;
    }

    const data = { name: $('name').value, bio: $('bio').value, avatar, theme: $('theme').value, links };
    const r = await fetch(api(`pages/${slug}.json`), { method: 'PUT', headers, body: JSON.stringify({
      message: 'Save page ' + slug,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
      sha
    }) });
    if (!r.ok) throw new Error('Error ' + r.status + ': ' + await r.text());
    msg.textContent = `Saved! Live in about a minute: https://${owner}.github.io/${repo}/p/${slug}/`;
  } catch (e) {
    msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
};
</script></body></html>
