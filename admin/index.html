<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link-in-bio builder</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:30px auto;padding:0 16px}
input,textarea,select,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box;font:inherit}
button{cursor:pointer}
</style></head>
<body>
<h2>Link-in-bio builder</h2>
<input id="owner" placeholder="GitHub username">
<input id="repo" placeholder="Repo name">
<input id="token" type="password" placeholder="Fine-grained token">
<hr>
<input id="slug" placeholder="Slug (e.g. jane) - becomes the link">
<input id="name" placeholder="Display name">
<input id="bio" placeholder="Bio">
<input id="avatar" placeholder="Avatar image URL">
<select id="theme"><option>dark</option><option>light</option><option>ocean</option></select>
<textarea id="links" rows="6" placeholder="One per line: Label | https://url"></textarea>
<button id="save">Save page</button>
<p id="msg"></p>
<script>
const $ = id => document.getElementById(id);
['owner','repo','token'].forEach(k => {
  $(k).value = localStorage.getItem('lib_' + k) || '';
  $(k).addEventListener('change', () => localStorage.setItem('lib_' + k, $(k).value.trim()));
});

$('save').onclick = async () => {
  const owner = $('owner').value.trim(), repo = $('repo').value.trim(), token = $('token').value.trim();
  const slug = $('slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
  if (!owner || !repo || !token || !slug) { $('msg').textContent = 'Fill owner, repo, token and slug.'; return; }

  const data = {
    name: $('name').value, bio: $('bio').value, avatar: $('avatar').value, theme: $('theme').value,
    links: $('links').value.split('\n')
      .map(l => l.split('|').map(s => s.trim()))
      .filter(a => a[0] && a[1])
      .map(([label, url]) => ({ label, url }))
  };

  const api = `https://api.github.com/repos/${owner}/${repo}/contents/pages/${slug}.json`;
  const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };

  let sha;
  const existing = await fetch(api, { headers });
  if (existing.ok) sha = (await existing.json()).sha;

  const body = {
    message: 'Save page ' + slug,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
    sha
  };
  const r = await fetch(api, { method: 'PUT', headers, body: JSON.stringify(body) });
  $('msg').textContent = r.ok
    ? `Saved! Live in about a minute: https://${owner}.github.io/${repo}/p/${slug}/`
    : 'Error ' + r.status + ': ' + await r.text();
};
</script></body></html>
